# Render Blueprint — deploy this repo at https://dashboard.render.com/blueprints
#
# One Docker web service (FastAPI + the static portals) and one managed
# Postgres. Shop logos go to Cloudflare R2, not to the service disk: Render's
# filesystem is replaced on every deploy and a disk would pin the service to a
# single instance with no zero-downtime deploys.
services:
  - type: web
    name: trimly
    runtime: docker
    plan: 0.5c-512mb          # cheapest always-on ($7/mo); `free` spins down after 15 min
    region: oregon            # must match the database region for the internal URL
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trimly-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true   # Render generates a 256-bit secret; never paste one here
      # PUBLIC_BASE_URL is optional: with no value the app uses Render's own
      # RENDER_EXTERNAL_URL. Set it only when you add a custom domain.
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_ENDPOINT_URL
        sync: false           # https://<ACCOUNT_ID>.r2.cloudflarestorage.com
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false           # public bucket URL or custom domain
      # Optional integrations: set these in the dashboard only if you use them.
      # WHATSAPP_ACCESS_TOKEN, WHATSAPP_PHONE_NUMBER_ID, WHATSAPP_VERIFY_TOKEN,
      # WHATSAPP_APP_SECRET, PAYMENT_PROVIDER, PAYMENT_API_KEY,
      # PAYMENT_WEBHOOK_SECRET, UPI_VPA

databases:
  - name: trimly-db
    plan: 0.1c-256mb          # ~$6/mo; the free plan expires 30 days after creation
    postgresMajorVersion: "16"
    region: oregon
